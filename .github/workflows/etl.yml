name: medallion-etl

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC login to Azure
  contents: read

jobs:
  etl:
    runs-on: ubuntu-latest
    env:
      ADLS_ACCOUNT_NAME: ${{ vars.ADLS_ACCOUNT_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: bronze -> silver
        run: python pipelines/bronze_to_silver.py

      - name: silver -> gold
        run: python pipelines/silver_to_gold.py
