name: medallion-etl

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      run_date:
        description: 'Date to process (YYYY-MM-DD). Leave blank for yesterday.'
        required: false

permissions:
  id-token: write   # required for OIDC login to Azure
  contents: read
  issues: write      # required to file/update the failure issue

concurrency:
  group: medallion-etl
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ADLS_ACCOUNT_NAME: ${{ vars.ADLS_ACCOUNT_NAME }}
      RUN_DATE: ${{ inputs.run_date }}
      PENTANA_API_BASE_URL: ${{ vars.PENTANA_API_BASE_URL }}
      PENTANA_API_KEY: ${{ secrets.PENTANA_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Skipped until PENTANA_API_BASE_URL is actually set — merging this
      # must not break the existing pipeline before real partner access exists.
      - name: ingest Pentana DMS
        if: vars.PENTANA_API_BASE_URL != ''
        run: python pipelines/ingest_pentana.py

      - name: bronze -> silver
        run: python pipelines/bronze_to_silver.py

      - name: silver -> gold
        run: python pipelines/silver_to_gold.py

      - name: File or update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'pipeline-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const runDate = process.env.RUN_DATE || '(default: yesterday)';
            const body = `\`medallion-etl\` failed for run_date \`${runDate}\`.\n\nRun: ${runUrl}`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });

            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'medallion-etl pipeline is failing',
                body,
                labels: [label],
              });
            }
